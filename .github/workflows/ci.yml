name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: EOD standing rules carry-forward
        run: node scripts/check-eod-standing-rules.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "9.15.9"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir .pnpm-store --package-import-method=copy

      - name: Check local preview runtime
        run: node scripts/check-local-preview-runtime.mjs

      - name: TypeScript
        run: node_modules/.bin/tsc --noEmit --noUnusedLocals --noUnusedParameters

      - name: Public brand consistency
        run: pnpm run brand:check

      - name: Lint
        run: node_modules/.bin/next lint

      - name: Feedback readiness
        run: pnpm run feedback:check

      - name: Production dependency audit
        run: pnpm run audit:prod

      - name: Full dependency audit
        run: pnpm run audit:full

      - name: Release source safeguards
        run: pnpm run release-source:check

      - name: Pre-migration Stripe compatibility
        run: pnpm run pre-migration-stripe-compatibility:check

      - name: Build
        run: pnpm run build
