name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: EOD standing rules carry-forward
        run: node scripts/check-eod-standing-rules.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "9.15.9"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir .pnpm-store --package-import-method=copy

      - name: Check local preview runtime
        run: node scripts/check-local-preview-runtime.mjs

      - name: TypeScript
        run: node_modules/.bin/tsc --noEmit --noUnusedLocals --noUnusedParameters

      - name: Member election history
        run: pnpm run member-service:check

      - name: Public brand consistency
        run: pnpm run brand:check

      - name: Lint
        run: node_modules/.bin/next lint

      - name: Feedback readiness
        run: pnpm run feedback:check

      - name: Production dependency audit
        run: pnpm run audit:prod

      - name: Audit and billing CI gate regression tests
        run: node --test scripts/check-braces-audit-exception.test.mjs scripts/check-billing-ci-coverage.test.mjs

      - name: Verify approved braces mitigation and development scope
        run: node scripts/check-braces-audit-exception.mjs --preflight "${{ runner.temp }}/capitolwonk-braces-audit"

      - name: Release source safeguards
        run: pnpm run release-source:check

      - name: Pre-migration Stripe compatibility
        run: pnpm run pre-migration-stripe-compatibility:check

      - name: Build
        run: pnpm run build

      - name: Full raw audit with narrowly scoped temporary exception
        run: node scripts/check-braces-audit-exception.mjs --finish "${{ runner.temp }}/capitolwonk-braces-audit"

      - name: Retain raw audit and exception evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: braces-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capitolwonk-braces-audit/
          if-no-files-found: warn
          retention-days: 30
